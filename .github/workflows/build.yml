.github/workflows/build.ymlname: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BusDriverAutoRP_source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip BusDriverAutoRP_source.zip
          cd BusDriverAutoRP

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd BusDriverAutoRP
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BusDriverAutoRP-APK
          path: BusDriverAutoRP/app/build/outputs/apk/debug/*.apk
